<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Celebration - Aditya & Srivalli</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1A3A8F, #0A1628);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .celebration-container {
            width: 100%;
            height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Background Video - RAW Wallpaper Replacement */
        .video-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        .video-background.active {
            opacity: 1;
        }

        /* Overlay for better text visibility */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(10, 22, 40, 0.3);
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Main Content */
        .celebration-content {
            position: relative;
            z-index: 3;
            text-align: center;
            color: white;
            max-width: 800px;
            padding: 40px 20px;
        }

        .celebration-title {
            font-size: 3.5rem;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
            animation: fadeInDown 1s ease-out;
        }

        .celebration-subtitle {
            font-size: 1.5rem;
            margin-bottom: 40px;
            color: #D4AF37;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 1s ease-out 0.2s both;
        }

        .enter-button {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, #D4AF37, #F0D47A);
            color: #0A1628;
            border: 2px solid #D4AF37;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            animation: fadeInUp 1s ease-out 0.4s both;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4);
        }

        .enter-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 30px rgba(212, 175, 55, 0.6);
            background: linear-gradient(135deg, #F0D47A, #D4AF37);
        }

        .enter-button:active {
            transform: translateY(-1px);
        }

        .upload-section {
            margin-top: 50px;
            animation: fadeInUp 1s ease-out 0.6s both;
        }

        .upload-label {
            display: block;
            font-size: 1rem;
            margin-bottom: 15px;
            color: #D4AF37;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
            cursor: pointer;
        }

        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            display: inline-block;
            padding: 12px 30px;
            background: rgba(212, 175, 55, 0.2);
            border: 2px dashed #D4AF37;
            border-radius: 8px;
            color: #D4AF37;
            font-weight: bold;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .file-input-label:hover {
            background: rgba(212, 175, 55, 0.3);
            transform: scale(1.05);
        }

        .file-name {
            display: block;
            margin-top: 10px;
            color: #7CA4D4;
            font-size: 0.9rem;
        }

        /* Confetti & Celebration Effects */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #D4AF37;
            pointer-events: none;
            z-index: 4;
        }

        .hidden {
            display: none !important;
        }

        /* Loading State */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #D4AF37;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes confettiFall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Video Controls Info */
        .video-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 5;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            max-width: 300px;
        }

        .video-info p {
            margin: 5px 0;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .celebration-title {
                font-size: 2.5rem;
            }

            .celebration-subtitle {
                font-size: 1.2rem;
            }

            .enter-button {
                padding: 12px 30px;
                font-size: 1rem;
            }

            .upload-section {
                margin-top: 30px;
            }
        }

        @media (max-width: 480px) {
            .celebration-title {
                font-size: 1.8rem;
            }

            .celebration-subtitle {
                font-size: 1rem;
            }

            .enter-button {
                padding: 10px 20px;
                font-size: 0.9rem;
            }

            .celebration-content {
                padding: 20px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="celebration-container">
        <!-- Video Background -->
        <video id="celebrationVideo" class="video-background" muted playsinline></video>

        <!-- Overlay -->
        <div class="overlay" id="overlay"></div>

        <!-- Celebration Content -->
        <div class="celebration-content" id="celebrationContent">
            <h1 class="celebration-title">🎊 Join Our Celebration! 🎊</h1>
            <p class="celebration-subtitle">Aditya ❤️ Srivalli</p>
            
            <button class="enter-button" id="enterButton">
                ENTER THE CELEBRATION →
            </button>

            <!-- Upload Video Section -->
            <div class="upload-section">
                <label class="upload-label">Or Upload Your Own Video:</label>
                <div class="file-input-wrapper">
                    <input type="file" id="videoInput" accept="video/*" aria-label="Upload celebration video">
                    <label for="videoInput" class="file-input-label">
                        📹 Choose Video File
                    </label>
                </div>
                <span class="file-name" id="fileName">No file selected</span>
            </div>
        </div>

        <!-- Video Info -->
        <div class="video-info">
            <p>💡 Video will auto-play after 2 seconds of clicking "ENTER"</p>
            <p>🎬 Supported formats: MP4, WebM, OGG</p>
        </div>
    </div>

    <script src="celebration-video.js"></script>
</body>
</html>
